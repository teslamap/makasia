<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makasia — ადმინ პანელი</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <style>
    body { background-color: #f8f9fa; }
    .admin-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .admin-section { background: white; padding: 24px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .admin-section h2 { margin-bottom: 20px; font-size: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f1f3f5; font-weight: 600; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .form-grid input, .form-grid select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; }
    .danger-btn { background: #ffe3e3; color: #c92a2a; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .danger-btn:hover { background: #ffc9c9; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h1>Makasia — ადმინისტრაცია</h1>
      <div>
        <a href="index.html" class="button" style="text-decoration:none; margin-right: 10px; background: #e9ecef; color: #333;">საიტზე დაბრუნება</a>
        <button id="adminLogout" class="button button-dark" style="background: #c92a2a;">გასვლა</button>
      </div>
    </div>

    <!-- პროდუქტის დამატების სექცია -->
    <div class="admin-section">
      <h2>ახალი პროდუქტის დამატება</h2>
      <form id="addProductForm">
        <div class="form-grid">
          <input type="text" id="prodName" placeholder="პროდუქტის დასახელება" required>
          <input type="number" id="prodPrice" placeholder="ფასი (₾)" required>
          <select id="prodCategory" required>
            <option value="">აირჩიეთ კატეგორია</option>
            <option value="ყოველდღიური">ყოველდღიური</option>
            <option value="საღამოს">საღამოს</option>
            <option value="ზურგჩანთები">ზურგჩანთები</option>
          </select>
          <input type="url" id="prodImage" placeholder="სურათის ბმული (URL)" required>
        </div>
        <button type="submit" class="button button-dark">დამატება კატალოგში</button>
      </form>
    </div>

    <!-- პროდუქტების სია -->
    <div class="admin-section">
      <h2>არსებული პროდუქტები</h2>
      <table>
        <thead>
          <tr>
            <th>სურათი</th>
            <th>სახელწოდება</th>
            <th>კატეგორია</th>
            <th>ფასი</th>
            <th>მოქმედება</th>
          </tr>
        </thead>
        <tbody id="adminProductTable">
          <tr><td colspan="5" style="text-align:center;">იტვირთება...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- შეკვეთების სექცია -->
    <div class="admin-section">
      <h2>შემოსული შეკვეთები</h2>
      <table>
        <thead>
          <tr>
            <th>თარიღი / ID</th>
            <th>მომხმარებელი</th>
            <th>ტელეფონი / მისამართი</th>
            <th>დეტალები</th>
            <th>თანხა</th>
            <th>სტატუსი</th>
          </tr>
        </thead>
        <tbody id="adminOrdersTable">
          <tr><td colspan="6" style="text-align:center;">იტვირთება...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast">ოპერაცია წარმატებით დასრულდა</div>

  <!-- Firebase SDK-ები -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- ადმინის სკრიპტი -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDuZpWaZFY18eyJNOMjFap2XVTr6D0cMyE",
      authDomain: "makasia.firebaseapp.com",
      projectId: "makasia",
      storageBucket: "makasia.firebasestorage.app",
      messagingSenderId: "51102698357",
      appId: "1:51102698357:web:59f62a3c8e76663947a13c"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();
    const auth = firebase.auth();

    // ადმინის შემოწმება
    auth.onAuthStateChanged((user) => {
        if (!user) {
            alert("გთხოვთ გაიაროთ ავტორიზაცია როგორც ადმინისტრატორმა!");
            window.location.href = "index.html";
        }
    });

    document.getElementById('adminLogout').addEventListener('click', () => {
        auth.signOut().then(() => {
            window.location.href = "index.html";
        });
    });

    // პროდუქტების გამოტანა და მართვა
    const adminProductTable = document.getElementById('adminProductTable');
    db.collection("products").onSnapshot((snapshot) => {
        adminProductTable.innerHTML = "";
        if(snapshot.empty) {
            adminProductTable.innerHTML = `<tr><td colspan="5" style="text-align:center;">პროდუქტები არ მოიძებნა</td></tr>`;
            return;
        }
        snapshot.forEach((doc) => {
            const p = doc.data();
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><img src="${p.image}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;"></td>
                <td><strong>${p.name}</strong></td>
                <td>${p.category}</td>
                <td>${p.price} ₾</td>
                <td><button class="danger-btn" onclick="deleteProduct('${doc.id}')">წაშლა</button></td>
            `;
            adminProductTable.appendChild(tr);
        });
    });

    // ახალი პროდუქტის დამატება
    document.getElementById('addProductForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('prodName').value;
        const price = Number(document.getElementById('prodPrice').value);
        const category = document.getElementById('prodCategory').value;
        const image = document.getElementById('prodImage').value;

        db.collection("products").add({ name, price, category, image, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(() => {
            showToast("პროდუქტი წარმატებით დაემატა!");
            e.target.reset();
        })
        .catch(err => {
            alert("შეცდომა პროდუქტის დამატებისას: " + err.message);
        });
    });

    window.deleteProduct = function(id) {
        if(confirm("ნამდვილად გსურთ პროდუქტის წაშლა?")) {
            db.collection("products").doc(id).delete().then(() => {
                showToast("პროდუქტი წაიშალა");
            });
        }
    };

    // შეკვეთების გამოტანა
    const adminOrdersTable = document.getElementById('adminOrdersTable');
    db.collection("orders").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        adminOrdersTable.innerHTML = "";
        if(snapshot.empty) {
            adminOrdersTable.innerHTML = `<tr><td colspan="6" style="text-align:center;">შეკვეთები ჯერ არ არის</td></tr>`;
            return;
        }
        snapshot.forEach((doc) => {
            const o = doc.data();
            const dateStr = o.createdAt ? new Date(o.createdAt.seconds * 1000).toLocaleString() : 'ახლახანს';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><small>${dateStr}</small></td>
                <td><strong>${o.customerName}</strong></td>
                <td>${o.phone}<br><small>${o.address}</small></td>
                <td><div style="max-height: 100px; overflow-y: auto;">${o.productDetails}</div><small>მიწოდება: ${o.delivery}</small></td>
                <td><strong>${o.totalPrice}</strong></td>
                <td><span style="background: #e7f5ff; color: #1971c2; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${o.status || 'ახალი'}</span></td>
            `;
            adminOrdersTable.appendChild(tr);
        });
    });

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
