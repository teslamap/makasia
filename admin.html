<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makasia - ადმინ პანელი</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .login-container, .admin-container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 20px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #219653; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .logout-btn { background: #e74c3c; padding: 8px 15px; font-size: 14px; }
        .logout-btn:hover { background: #c0392b; }
        
        /* შეკვეთების ბარათები მობილურისთვისაც რომ იდეალური იყოს */
        .order-card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; color: #34495e; margin-bottom: 8px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .order-body p { margin-bottom: 6px; font-size: 14px; }
        .order-body span { font-weight: 600; color: #555; }
        .no-orders { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <!-- ავტორიზაციის ფანჯარა ადმინისთვის -->
    <div id="loginSection" class="login-container">
        <h2>ადმინისტრატორად შესვლა</h2>
        <div class="form-group">
            <label>ელ-ფოსტა:</label>
            <input type="email" id="adminEmail" placeholder="admin@makasia.com">
        </div>
        <div class="form-group">
            <label>პაროლი:</label>
            <input type="password" id="adminPassword" placeholder="******">
        </div>
        <button id="loginBtn">შესვლა</button>
        <p id="loginError" style="color: red; margin-top: 10px; font-size: 14px;"></p>
    </div>

    <!-- შეკვეთების სრული პანელი -->
    <div id="adminSection" class="admin-container" style="display: none;">
        <div class="admin-header">
            <h2>შეკვეთების სრული დეტალიზაცია</h2>
            <button class="logout-btn" id="logoutBtn">მოსვლა / გასვლა</button>
        </div>
        <div id="ordersList">
            <p class="no-orders">იტვირთება შეკვეთები...</p>
        </div>
    </div>

    <!-- Firebase SDK-ები -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <script src="admin.js"></script>
</body>
</html>
