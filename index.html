<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makasia - შეკვეთა</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; font-size: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: #3498db; }
        button { width: 100%; background: #3498db; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background: #2980b9; }
        .admin-link { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
        .admin-link:hover { color: #3498db; }
    </style>
</head>
<body>

    <div class="container">
        <h2>შეკვეთის ფორმა</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="customerName">სახელი და გვარი:</label>
                <input type="text" id="customerName" required placeholder="მაგ: ნინო ბერიძე">
            </div>
            <div class="form-group">
                <label for="phone">ტელეფონის ნომერი:</label>
                <input type="tel" id="phone" required placeholder="მაგ: 599123456">
            </div>
            <div class="form-group">
                <label for="address">მისამართი:</label>
                <input type="text" id="address" required placeholder="ქუჩა, ნომერი, სართული">
            </div>
            <div class="form-group">
                <label for="productDetails">პროდუქტი და დეტალები:</label>
                <textarea id="productDetails" rows="3" required placeholder="რა შეუკვეთა, მოდელი, ფერი..."></textarea>
            </div>
            <div class="form-group">
                <label for="quantity">რაოდენობა:</label>
                <input type="number" id="quantity" min="1" value="1" required>
            </div>
            <div class="form-group">
                <label for="totalPrice">საერთო ფასი (₾):</label>
                <input type="text" id="totalPrice" required placeholder="მაგ: 150 ₾">
            </div>
            <button type="submit">შეკვეთის გაგზავნა</button>
        </form>
        <a href="admin.html" class="link-btn admin-link">ადმინისტრაციულ პანელში გადასვლა</a>
    </div>

    <!-- Firebase SDK-ები -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <!-- შენი კოდი (firebase კონფიგურაცია და ლოგიკა) -->
    <script src="script.js"></script>
</body>
</html>
